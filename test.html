  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var offcanvas = document.querySelector('.offcanvas');
      var videoUrls = [
        'https://player.vimeo.com/video/930010565?h=768b62e0be',
        'https://www.youtube.com/embed/another-video-url',
        // Add more video URLs as needed
      ];
      var currentVideoIndex = 0;

      // Function to clear the iframe src attribute
      function clearIframeSrc() {
        var iframe = offcanvas.querySelector('iframe');
        iframe.setAttribute('src', '');
      }

      // Function to set the iframe src attribute to the desired video URL
      function setIframeSrc(videoUrl) {
        var iframe = offcanvas.querySelector('iframe');
        iframe.setAttribute('src', videoUrl);
      }

      // Function to handle changing the video
      function changeVideo() {
        clearIframeSrc();
        setIframeSrc(videoUrls[currentVideoIndex]);
      }

      // Event listener for offcanvas hidden event
      offcanvas.addEventListener('hidden.bs.offcanvas', function () {
        clearIframeSrc();
      });

      // Event listener for offcanvas shown event
      offcanvas.addEventListener('shown.bs.offcanvas', function () {
        // Start with the first video in the array
        setIframeSrc(videoUrls[currentVideoIndex]);
      });

      // Event listener for next button click
      document.getElementById('nextButton').addEventListener('click', function () {
        currentVideoIndex = (currentVideoIndex + 1) % videoUrls.length;
        changeVideo();
      });

      // Event listener for previous button click
      document.getElementById('prevButton').addEventListener('click', function () {
        currentVideoIndex = (currentVideoIndex - 1 + videoUrls.length) % videoUrls.length;
        changeVideo();
      });
    });
  </script>
