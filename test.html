<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animated Title</title>
<style>
    /* Add animation CSS */
    .animated-title {
        position: fixed;
        top: 0;
        right: 0;
        transform: translateX(100%);
        transition: transform 1s ease;
    }

    .animate-title {
        transform: translateX(0);
    }
    .animated-title {
        color: #000;
        font-size: 400px;
    }
    .zoom-out {
  transform: scale(0.5); /* Adjust the scale value for desired zoom level */
  transition: transform 1s ease; /* Set duration and easing for zoom animation */
}
</style>
</head>
<body>

    <div style="height: 700px; background-color: red;"></div>

<div class="main-wrapper">
    <div class="gl-section-title">
        <!-- Add class 'animated-title' to the title -->
        <h2 class="h1 title animated-title">Numbers</h2>
    </div>

    <div class="inclusion-content-wrap">
        <!-- Your existing content goes here -->
    </div>

    <div class="primary-btn donate-btn" data-aos="fade-right">
        <a href="https://donatenow.networkforgood.org/ascendus/mobile" target="_blank">
            <span>View our Financial<br> statement</span>
        </a>
    </div>
</div>

<div style="height: 7000px; background-color: aqua;"></div>

<script>
window.addEventListener('scroll', function() {
  var title = document.querySelector('.animated-title');
  var scrollPosition = window.scrollY;

  if (scrollPosition > 70) {
    title.classList.add('animate-title'); // Animate right to left

    // Add a short timeout to trigger zoom-out after the initial animation finishes
    setTimeout(function() {
      title.classList.add('zoom-out'); // Zoom out the title
    }, 700); // Adjust timeout value if needed (in milliseconds)
  } else {
    title.classList.remove('animate-title');
    title.classList.remove('zoom-out'); // Reset zoom on scroll up
  }
});
</script>

</body>
</html>
